name: RenpySwitch Build
run-name: ${{ github.actor }} building Ren'Py 8.5.3 for Switch

on:
  push:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Title shown in the Homebrew Menu"
        default: "Ren'Py"
      app_author:
        description: "Author shown in the Homebrew Menu"
        default: "Ren'Py Switch"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix line endings
        run: sed -i 's/\r$//' setup.bash build.bash pack_nro.bash

      - name: Cache Ren'Py downloads
        uses: actions/cache@v4
        with:
          path: downloads
          key: renpy-downloads-8.5.3

      - name: Cache NXPython (CPython 3.14 for Switch)
        uses: actions/cache@v4
        with:
          path: |
            /opt/devkitpro/portlibs/switch/lib/libpython3.14.a
            /opt/devkitpro/portlibs/switch/lib/python3.14
            /opt/devkitpro/portlibs/switch/include/python3.14
            /opt/devkitpro/portlibs/switch/lib/pkgconfig/python-3.14.pc
            /opt/devkitpro/portlibs/switch/lib/pkgconfig/python-3.14-embed.pc
            /opt/devkitpro/portlibs/switch/lib/pkgconfig/python3.pc
            /opt/devkitpro/portlibs/switch/lib/pkgconfig/python3-embed.pc
            /opt/devkitpro/portlibs/switch/share/python-switch
            /tmp/NXPython/build/cpython/build/nx-portlibs/build-python
          key: nxpython-86cde18-1b1c61a9-v1

      - name: Setup (portlibs, NXPython, Ren'Py sources)
        run: |
          set -o pipefail
          bash setup.bash 2>&1 | tee setup.log

      - name: Build
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'Ren''Py' }}
          APP_AUTHOR: ${{ github.event.inputs.app_author || 'Ren''Py Switch' }}
        run: |
          set -o pipefail
          bash build.bash 2>&1 | tee build.log

      - name: Upload launcher (.nro)
        uses: actions/upload-artifact@v4
        with:
          name: renpy-switch-nro
          path: raw/renpy-switch.nro

      - name: Upload re-packaging kit (ELF + RomFS + NSO)
        uses: actions/upload-artifact@v4
        with:
          name: renpy-switch-raw
          path: |
            raw/renpy-switch.elf
            raw/exefs/main
            raw/romfs

      # Logs on GitHub's storage are not always reachable for debugging, so the
      # logs are also pushed to the "ci-logs" branch, and on failure the first
      # errors are shown as annotations.
      - name: Report errors
        if: failure()
        run: |
          grep -h -n -E "error|Error|undefined reference|No such file|Traceback|not found" setup.log build.log 2>/dev/null \
            | grep -v -E "^[0-9]+:(  |\+)?-W|Werror=" | head -10 | while IFS= read -r l; do
              l="${l//'%'/'%25'}"; echo "::error::${l:0:900}"
            done || true

      - name: Publish logs to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/cilog
          git clone -q --depth 1 -b ci-logs "$URL" /tmp/cilog 2>/dev/null || (mkdir -p /tmp/cilog && git -C /tmp/cilog init -q -b ci-logs)
          cp setup.log build.log /tmp/cilog/ 2>/dev/null || true
          [ -d build-switch/cmake/CMakeFiles ] && cp build-switch/cmake/CMakeFiles/CMake*.log /tmp/cilog/ 2>/dev/null || true
          echo "${GITHUB_RUN_ID} ${GITHUB_SHA} ${{ job.status }}" > /tmp/cilog/RUN.txt
          if [ -d raw ]; then
            (cd raw && ls -la && du -sh romfs romfs/* romfs/*/* 2>/dev/null) > /tmp/cilog/raw-summary.txt
            (cd raw/romfs && find . -type f | sort) > /tmp/cilog/romfs-files.txt
          fi
          # Symbol table of this build, to symbolize crash reports (offsets are
          # printed relative to main()).
          if [ -f raw/renpy-switch.elf ]; then
            mkdir -p /tmp/cilog/symbols
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm -n -C raw/renpy-switch.elf \
              | grep -E ' [TtWw] ' | gzip -9 > "/tmp/cilog/symbols/${GITHUB_SHA:0:7}.txt.gz"
          fi
          cd /tmp/cilog
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Logs of run ${GITHUB_RUN_ID} (${GITHUB_SHA:0:7})" || true
          git push -q "$URL" HEAD:ci-logs
